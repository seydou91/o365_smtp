services:
  logger.channel.o365_smtp:
    parent: logger.channel_base
    arguments: ['o365_smtp']

  o365_smtp.client:
    class: Drupal\o365_smtp\Service\O365Client
    arguments:
      - '@config.factory'
      - '@http_client'
      - '@state'
      - '@logger.channel.o365_smtp'
      - '@file_system'
      - '@email.validator'
      - '@request_stack'
      - '@lock'
